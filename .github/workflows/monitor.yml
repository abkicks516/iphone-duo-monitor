name: iPhone Duo stock monitor

on:
  # Each run checks every 60 seconds for ~5h40m. The 30-minute schedule just makes
  # sure a new run is always queued, so there's no gap when one finishes.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write # to commit stock-history.csv

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check availability
        env:
          ZIP_CODE: ${{ vars.ZIP_CODE || '23060' }}
          INCLUDE_KEYWORDS: ${{ vars.INCLUDE_KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS || '1TB,2TB' }}
          CARRIER: ${{ vars.CARRIER || 'verizon-apple-upgrade' }}
          PARTS: ${{ vars.PARTS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'duo-watch-7f3k9qq' }}
          RUN_MINUTES: "340"
          INTERVAL_SECONDS: "60"
        run: python3 -u monitor.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
