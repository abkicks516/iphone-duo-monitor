name: iPhone Duo stock monitor

on:
  # Each run checks every 60 seconds for ~5h40m. The 30-minute schedule just makes
  # sure a new run is always queued, so there's no gap when one finishes.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write # to commit stock history

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false # one watcher failing shouldn't stop the others
      matrix:
        # One entry per person. Each gets its own alerts, settings and history file.
        include:
          - name: dc-nova
            zip: "22102" # Tysons: covers all 12 DC-area stores (NoVA, DC, nearby MD)
            topic: duo-watch-7f3k9qq
            exclude: ""
            carrier: unlocked
            history: stock-history-dc-nova.csv
          - name: nyc-nj
            zip: "10001,08901,10475,07652,11256" # covers all 27 stores near their ZIP list
            topic: duo-watch-ny-qci1o0ym
            exclude: ""
            carrier: unlocked
            history: stock-history-nyc-nj.csv
    name: check (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            state-${{ matrix.name }}-

      - name: Check availability
        env:
          ZIP_CODE: ${{ matrix.zip }}
          NTFY_TOPIC: ${{ matrix.topic }}
          EXCLUDE_KEYWORDS: ${{ matrix.exclude }}
          CARRIER: ${{ matrix.carrier }}
          HISTORY_FILE: ${{ matrix.history }}
          RUN_MINUTES: "340"
          INTERVAL_SECONDS: "60"
        run: python3 -u monitor.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ matrix.name }}-${{ github.run_id }}
