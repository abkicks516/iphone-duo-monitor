name: probe
on: { push: { branches: [probe-link] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          B=https://www.apple.com/shop/buy-iphone/iphone-duo/7.6-inch-display
          for s in 256gb-night-sky-verizon-apple-upgrade 512gb-star-white-verizon-apple-upgrade 256gb-night-sky-verizon 256gb-night-sky-bogus-carrier; do
            echo "::warning::$(curl -s -A "$UA" -o p.html -w "%{http_code} -> %{redirect_url}" "$B-$s") $(wc -c < p.html)b :: $s"
          done
          curl -sL -A "$UA" "$B-256gb-night-sky-verizon" -o v.html
          echo "::warning::carrier slugs: $(grep -oE '7\.6-inch-display-256gb-night-sky-[a-z-]+' v.html | sort -u | tr '\n' ' ')"
          echo "::warning::upgrade mentions: $(grep -oiE '.{0,60}apple-upgrade.{0,60}' v.html | head -3 | tr '\n' ' ' | cut -c1-500)"
