name: probe
on: { push: { branches: [probe-link] } }
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import os
          os.environ["CARRIER"] = "unlocked"
          import monitor as m
          m.PRICES["MK1F4LL/A"] = 1999
          hit = {"part": "MK1F4LL/A", "title": "iPhone Duo 256GB Night Sky", "store": "Tysons Corner", "city": "McLean",
                 "state": "VA", "quote": "Available Today", "phone": "703-3368450",
                 "street": "7926 Tysons Corner Center", "zip": "22102", "hours": "10:00 AM-9:00 PM"}
          title, msg, url, actions = m.alert_for(hit)
          m.notify("duo-watch-7f3k9qq", "TEST - " + title, "TEST ONLY, not real stock.\n" + msg, url, actions)
          print("::warning::sent")
          PY
