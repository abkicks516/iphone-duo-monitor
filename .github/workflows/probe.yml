name: probe
on: { push: { branches: [probe-link] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://ntfy.sh/duo-watch-7f3k9qq/json?poll=1&since=all" -o h.json
          echo "::warning::count $(wc -l < h.json)"
          TZ=America/New_York jq -r '"\(.time|strflocaltime("%a %I:%M:%S %p")) | \(.title // "-") | \((.message // "")|gsub("\n";" / ")|.[0:140])"' h.json | while read -r l; do echo "::warning::$l"; done
