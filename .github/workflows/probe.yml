name: probe
on: { push: { branches: [probe-link] } }
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import monitor as m
          m.PRICES["MK1J4LL/A"] = 2599
          hit = {"part": "MK1J4LL/A", "title": "iPhone Duo 1TB Night Sky", "store": "Tysons Corner", "city": "McLean",
                 "state": "VA", "quote": "Available Today", "phone": "703-3368450",
                 "street": "7926 Tysons Corner Center", "zip": "22102", "hours": "11:00 AM-7:00 PM"}
          title, msg, url, actions = m.alert_for(hit)
          m.notify("duo-watch-7f3k9qq", "SAMPLE - " + title, "SAMPLE ONLY, not real stock.\n" + msg, url, actions)
          print("::warning::sent")
          PY
